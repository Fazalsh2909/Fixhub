# fixhub-api.service.d/10-netd.conf — drop-in for the existing API unit.
#
# Install: /etc/systemd/system/fixhub-api.service.d/10-netd.conf
#          (or fixhub-worker.service.d/ for the RQ worker that provisions VMs)
#
# The API MUST keep running unprivileged with its existing hardening:
#   User=fixhub  Group=fixhub  NoNewPrivileges=true
# (+ whatever ProtectSystem/PrivateTmp/etc. the host unit already sets).
# This drop-in only ADDS the delegation socket path and ordering on the
# privileged boundary services. It never grants capabilities, sudo, or file
# modes that would weaken the sandbox.
[Unit]
Requires=fixhub-netd.service fixhub-egress.service
After=fixhub-netd.service fixhub-egress.service

[Service]
Environment=FC_NETD_SOCKET=/run/fixhub-netd.sock

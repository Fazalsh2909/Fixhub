# fixhub-api.service.d/10-security.conf — drop-in for the existing API unit.
#
# Install: /etc/systemd/system/fixhub-api.service.d/10-security.conf
# Applied by: infra/systemd/install_api_security.py (idempotent)
#
# Deployed staging/production is served over HTTPS behind the reverse proxy.
# `app.main._enforce_production_guards()` refuses to boot a deployed
# environment unless auth cookies carry the Secure attribute, and
# `app.api.auth` derives that attribute from this setting. Local development
# keeps AUTH_COOKIE_SECURE=0 in backend/.env for plain-HTTP localhost.
#
# systemd gives EnvironmentFile= precedence over Environment=, and reads
# multiple EnvironmentFile= entries in order with the later file winning.
# The base unit reads /home/ubuntu/Fixhub/backend/.env first; this drop-in
# appends a root-owned file afterwards, so it overrides the host .env for this
# setting. Environment= remains as defense in depth.
[Service]
Environment=AUTH_COOKIE_SECURE=1
EnvironmentFile=/etc/fixhub/api-security.env

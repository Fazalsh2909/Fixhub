server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (CSP kept loose for Vite + Monaco; tighten if you add analytics).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # API → backend (same-origin in prod, so no CORS needed).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /health { proxy_pass http://api:8000; }
  location = /health/ready { proxy_pass http://api:8000; }
  location /webhooks/ { proxy_pass http://api:8000; }

  location / {
    try_files $uri /index.html;
  }
}

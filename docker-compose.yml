services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "redisdata:/data"
    restart: unless-stopped
  # Phase 4: production database. Local dev keeps SQLite by default; set
  # USE_POSTGRES=1 (or override DATABASE_URL) to run backend+worker on PG.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixhub
      POSTGRES_PASSWORD: fixhub
      POSTGRES_DB: fixhub
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixhub -d fixhub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    # Host 8001: 8000 is taken on this machine by another stack (infra-api).
    ports: ["8001:8000"]
    env_file: ./backend/.env
    environment:
      # Docker default; override in backend/.env for local runs.
      WORKSPACE_ROOT: /tmp/fixhub-workspaces
      WORKSPACE_KEEP: "0"
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: fixhub
      # SQLite default (dev). Production: postgresql+psycopg://fixhub:fixhub@postgres:5432/fixhub
      DATABASE_URL: sqlite:////srv/backend/data/fixhub.db
    volumes:
      - "workspaces:/tmp/fixhub-workspaces"
      - "dbdata:/srv/backend/data"
      # GitHub App private key (dockerignored from the image, mounted read-only).
      - "./backend/fixhub-app.pem:/srv/backend/fixhub-app.pem:ro"
    depends_on: [redis]
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.tasks.worker"]
    env_file: ./backend/.env
    environment:
      WORKSPACE_ROOT: /tmp/fixhub-workspaces
      WORKSPACE_KEEP: "0"
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: fixhub
      DATABASE_URL: sqlite:////srv/backend/data/fixhub.db
    volumes:
      - "workspaces:/tmp/fixhub-workspaces"
      - "dbdata:/srv/backend/data"
      - "./backend/fixhub-app.pem:/srv/backend/fixhub-app.pem:ro"
    depends_on: [redis, backend]
    restart: unless-stopped
    # Scale: docker compose up --scale worker=N (claim guard keeps it safe).
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  workspaces:
  redisdata:
  dbdata:
  pgdata:
